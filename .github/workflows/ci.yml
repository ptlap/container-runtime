name: CI

on:
  push:
    branches: [main, techdebt/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    name: Format, tests and Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests and benchmarks
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check release build
        run: cargo build --release --locked

  root-integration:
    name: Root integration tests
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 iptables strace

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: true

      - name: Run privileged runtime suite
        run: sudo -E env PATH="$PATH" cargo test --test root_runtime -- --ignored --nocapture
